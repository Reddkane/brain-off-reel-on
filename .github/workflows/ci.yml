name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node --version
      - run: docker version
      # Pull outside the runners' per-command Docker timeouts.
      - run: docker pull "$(cat tooling/db-image.txt)"
      - run: npm run test:db
  metadata-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker version
      # Pull outside the runners' per-command Docker timeouts.
      - run: docker pull "$(cat tooling/db-image.txt)"
      - run: npm run test:metadata:db
      - run: npm run metadata:local -- --scenario repeat
      - run: npm run metadata:dry-run -- --config tests/fixtures/pr-03/discovery-synthetic.json --as-of 2026-10-03
      - run: npm run ratings:dry-run -- --input tests/fixtures/pr-03/ratings-synthetic.json --as-of 2026-10-03
      - run: npm run test:catalog:db
      - run: npm run test:availability:sweeps:db
      - run: npm run availability:sweeps -- --config config/availability-sweeps.example.json
